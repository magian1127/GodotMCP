interface:
  display_name: "Godot 项目设置"
  short_description: "为项目安装、配置并验证 Godot MCP 与插件连接"
  brand_color: "#478CBF"
  default_prompt: "使用 $godot-project-setup 将 Godot MCP Unified 安装到此项目，并验证连接。"

dependencies:
  tools:
    - type: "mcp"
      value: "godot"
      description: "由此工作流安装的本地 Godot MCP 桥接"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
